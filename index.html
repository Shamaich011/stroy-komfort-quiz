<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Строй Комфорт — расчёт стоимости ремонта</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF8F1;
    --grid:#EFEBDD;
    --card:#FFFFFF;
    --line:#E3E0D2;
    --navy:#21212D;
    --navy-soft:#5B5D6E;
    --gold:#F3CC02;
    --gold-deep:#C9A800;
    --error:#C43D3D;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0/100% 28px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/28px 100%,
      var(--bg);
    color:var(--navy);
    font-family:'Inter',sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }
  .wrap{width:100%;max-width:560px;}

  .brand{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:22px;
  }
  .brand-left{display:flex;align-items:center;gap:12px;}
  .brand-left img{
    width:52px;height:52px;
    border-radius:50%;
    display:block;
  }
  .brand-left .word{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:18px;
    text-transform:uppercase;
    letter-spacing:0.01em;
    line-height:1.2;
  }
  .brand-left .word small{
    display:block;
    font-family:'Inter',sans-serif;
    font-weight:400;
    font-size:11px;
    letter-spacing:0.03em;
    text-transform:none;
    color:var(--navy-soft);
  }
  .brand span.city{
    font-family:'Oswald',sans-serif;
    font-size:12px;
    color:var(--navy-soft);
    text-transform:uppercase;
    letter-spacing:0.08em;
    border:1px solid var(--line);
    padding:4px 10px;
    border-radius:2px;
  }

  .tape-bar{
    height:14px;
    border-radius:2px;
    background:var(--card);
    border:1px solid var(--line);
    overflow:hidden;
    margin-bottom:6px;
  }
  .tape-fill{
    height:100%;
    background:repeating-linear-gradient(-45deg, var(--gold) 0 8px, #FFF4B8 8px 16px);
    transition:width .2s;
  }
  .tape-labels{
    display:flex;
    justify-content:space-between;
    font-family:'Oswald',sans-serif;
    font-size:11px;
    letter-spacing:0.06em;
    color:var(--navy-soft);
    text-transform:uppercase;
    margin-bottom:26px;
  }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-left:4px solid var(--gold);
    border-radius:3px;
    padding:32px 28px;
    box-shadow:0 1px 2px rgba(33,33,45,0.04);
  }
  .step-num{
    font-family:'Oswald',sans-serif;
    font-size:64px;
    font-weight:700;
    color:var(--grid);
    line-height:1;
    margin:0 0 4px;
  }
  .step-label{
    font-family:'Oswald',sans-serif;
    font-size:12px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--gold-deep);
    margin:0 0 14px;
  }
  h2{
    font-family:'Oswald',sans-serif;
    font-weight:500;
    font-size:23px;
    line-height:1.3;
    margin:0 0 26px;
    max-width:24ch;
    color:var(--navy);
  }

  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:14px;
    text-align:left;
    padding:14px 16px;
    background:transparent;
    border:1px solid var(--line);
    border-radius:2px;
    font-family:'Inter',sans-serif;
    font-size:15px;
    color:var(--navy);
    cursor:pointer;
    transition:border-color .15s, background .15s, transform .1s;
  }
  .opt .tag{
    font-family:'Oswald',sans-serif;
    font-size:12px;
    color:var(--navy-soft);
    border:1px solid var(--line);
    border-radius:2px;
    width:26px;height:26px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .opt:hover{border-color:var(--gold-deep);background:#FFFBEA;}
  .opt:hover .tag{border-color:var(--gold-deep);color:var(--gold-deep);background:var(--gold);}
  .opt:active{transform:scale(0.99);}

  .field-row{margin-bottom:16px;}
  .field-row label{
    display:block;
    font-family:'Oswald',sans-serif;
    font-size:12px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--navy-soft);
    margin-bottom:8px;
  }
  .field-row input{
    width:100%;
    padding:13px 14px;
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:2px;
    font-family:'Inter',sans-serif;
    font-size:15px;
    color:var(--navy);
  }
  .field-row input::placeholder{color:#B4B0A0;}
  .field-row input:focus{outline:none;border-color:var(--gold-deep);}
  .err{
    font-size:13px;
    color:var(--error);
    margin:-10px 0 14px;
    display:none;
  }

  .submit{
    width:100%;
    padding:15px;
    background:var(--navy);
    color:var(--gold);
    border:none;
    border-radius:2px;
    font-family:'Oswald',sans-serif;
    font-size:15px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.04em;
    cursor:pointer;
    margin-top:8px;
  }
  .submit:hover{background:#33334A;}
  .submit:disabled{opacity:0.6;cursor:default;}

  .back{
    background:none;
    border:none;
    color:var(--navy-soft);
    font-family:'Oswald',sans-serif;
    font-size:12px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    cursor:pointer;
    padding:0;
    margin-bottom:20px;
  }
  .back:hover{color:var(--gold-deep);}

  .done-screen{text-align:center;padding:20px 0 8px;}
  .stamp{
    width:150px;height:150px;
    margin:0 auto 22px;
    border:3px solid var(--navy);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    transform:rotate(-9deg);
    position:relative;
    background:var(--navy);
  }
  .stamp::before{
    content:'';
    position:absolute;
    inset:8px;
    border:1px solid var(--gold);
    border-radius:50%;
  }
  .stamp span{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    font-size:16px;
    color:var(--gold);
    text-transform:uppercase;
    letter-spacing:0.03em;
    line-height:1.3;
  }
  .done-screen p{
    font-size:15px;
    color:var(--navy-soft);
    line-height:1.65;
    max-width:34ch;
    margin:0 auto;
  }

  .foot{
    text-align:center;
    margin-top:18px;
    font-family:'Oswald',sans-serif;
    font-size:11px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    color:var(--navy-soft);
  }

  /* admin */
  .admin h1{font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:24px;margin:0 0 4px;}
  .admin .sub{color:var(--navy-soft);font-size:13px;margin:0 0 24px;}
  .lead{
    background:var(--card);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:3px;
    padding:16px 18px;margin-bottom:10px;font-size:14px;line-height:1.7;
  }
  .lead .name{font-weight:600;font-family:'Inter',sans-serif;}
  .lead .meta{color:var(--navy-soft);font-size:12px;}
  .empty{color:var(--navy-soft);font-size:14px;}
</style>
</head>

const QUESTIONS = [
  {key:'object', q:'Какой у вас объект?', opts:['Квартира','Дом','Офис','Магазин']},
  {key:'area', q:'Какая площадь?', opts:['до 40 м²','40–70 м²','70–100 м²','больше 100 м²']},
  {key:'type', q:'Какой ремонт нужен?', opts:['Косметический','Капитальный','Дизайнерский','После застройщика']},
  {key:'budget', q:'Примерный бюджет?', opts:['до 500 тыс. ₽','500 тыс. – 1 млн ₽','1–2 млн ₽','больше 2 млн ₽']},
  {key:'timing', q:'Когда планируете начать?', opts:['Уже сейчас','В течение месяца','Через 1–3 месяца','Пока присматриваюсь']},
];

const isAdmin = new URLSearchParams(location.search).get('admin') === '1';
const app = document.getElementById('app');
let step = 0;
const answers = {};

function escapeHtml(s){
  return s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function brandHeader(){
  return `
    <div class="brand">
      <div class="brand-left">
        <img src="${LOGO_SRC}" alt="Строй Комфорт">
        <div class="word">Строй Комфорт<small>Люди — важнее денег</small></div>
      </div>
      <span class="city">Краснодар</span>
    </div>
  `;
}

function renderTape(){
  const total = QUESTIONS.length + 1;
  const pct = Math.round((step / total) * 100);
  return `
    <div class="tape-bar"><div class="tape-fill" style="width:${pct}%"></div></div>
    <div class="tape-labels"><span>Замер ${Math.min(step+1,total)} / ${total}</span><span>${pct}%</span></div>
  `;
}

function renderQuestion(){
  const q = QUESTIONS[step];
  const num = String(step + 1).padStart(2,'0');
  let opts = q.opts.map((o,i) => `<button class="opt" data-val="${escapeHtml(o)}"><span class="tag">${String(i+1).padStart(2,'0')}</span>${escapeHtml(o)}</button>`).join('');
  app.innerHTML = `
    ${brandHeader()}
    ${renderTape()}
    <div class="card">
      ${step > 0 ? '<button class="back" id="backBtn">← Назад</button>' : ''}
      <p class="step-num">${num}</p>
      <p class="step-label">Вопрос ${step + 1} из ${QUESTIONS.length + 1}</p>
      <h2>${q.q}</h2>
      <div class="options">${opts}</div>
    </div>
    <p class="foot">Бесплатный расчёт · без обязательств${step === 0 ? ' · <a href="/calc" style="color:var(--gold-deep)">Подробный калькулятор с материалами →</a>' : ''}</p>
  `;
  document.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      answers[q.key] = btn.dataset.val;
      step++;
      render();
    });
  });
  const backBtn = document.getElementById('backBtn');
  if(backBtn) backBtn.addEventListener('click', ()=>{ step--; render(); });
}

function renderContactForm(){
  const num = String(QUESTIONS.length + 1).padStart(2,'0');
  app.innerHTML = `
    ${brandHeader()}
    ${renderTape()}
    <div class="card">
      <button class="back" id="backBtn">← Назад</button>
      <p class="step-num">${num}</p>
      <p class="step-label">Последний шаг</p>
      <h2>Куда прислать расчёт?</h2>
      <div class="field-row">
        <label for="nameInput">Имя</label>
        <input id="nameInput" type="text" placeholder="Как к вам обращаться">
      </div>
      <p class="err" id="nameErr">Введите имя</p>
      <div class="field-row">
        <label for="phoneInput">Телефон</label>
        <input id="phoneInput" type="tel" placeholder="+7 900 000 00 00">
      </div>
      <p class="err" id="phoneErr">Введите телефон</p>
      <label style="display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--navy-soft);margin:4px 0 12px;cursor:pointer">
        <input id="consentInput" type="checkbox" style="width:18px;height:18px;margin:0;accent-color:var(--navy)">
        Согласен на обработку персональных данных для связи со мной по расчёту
      </label>
      <p class="err" id="consentErr">Нужно согласие на обработку данных</p>
      <button class="submit" id="submitBtn">Получить расчёт</button>
    </div>
    <p class="foot">Специалист свяжется в течение 15 минут</p>
  `;
  document.getElementById('backBtn').addEventListener('click', ()=>{ step--; render(); });
  document.getElementById('submitBtn').addEventListener('click', onSubmit);
}

async function onSubmit(){
  const nameInput = document.getElementById('nameInput');
  const phoneInput = document.getElementById('phoneInput');
  const nameErr = document.getElementById('nameErr');
  const phoneErr = document.getElementById('phoneErr');
  const name = nameInput.value.trim();
  const phone = phoneInput.value.trim();
  let ok = true;
  if(name.length < 2){ nameErr.style.display='block'; ok=false; } else { nameErr.style.display='none'; }
  if(phone.replace(/\D/g,'').length < 10){ phoneErr.style.display='block'; ok=false; } else { phoneErr.style.display='none'; }
  const consent = document.getElementById('consentInput').checked;
  document.getElementById('consentErr').style.display = consent ? 'none' : 'block';
  if(!consent) ok=false;
  if(!ok) return;

  const submitBtn = document.getElementById('submitBtn');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Отправляем…';

  try{
    const res = await fetch('/api/quiz-leads', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ name, phone, consent:true, answers })
    });
    if(!res.ok) throw new Error((await res.json().catch(()=>({}))).error || 'Ошибка отправки');
  }catch(e){
    console.error('Lead error', e);
    submitBtn.disabled = false;
    submitBtn.textContent = 'Получить расчёт';
    phoneErr.textContent = e.message || 'Не удалось отправить, попробуйте ещё раз';
    phoneErr.style.display = 'block';
    return;
  }
  step = QUESTIONS.length + 1;
  render();
}

function renderDone(){
  app.innerHTML = `
    ${brandHeader()}
    <div class="card">
      <div class="done-screen">
        <div class="stamp"><span>Заявка<br>принята</span></div>
        <p>Специалист свяжется с вами в течение 15 минут и пришлёт точный расчёт по вашим параметрам.</p>
        <p style="margin-top:18px"><a class="submit" style="display:inline-block;width:auto;padding:13px 20px;text-decoration:none" href="/calc">Посчитать смету самому</a></p>
      </div>
    </div>
  `;
}

function render(){
  if(step < QUESTIONS.length) renderQuestion();
  else if(step === QUESTIONS.length) renderContactForm();
  else renderDone();
}

if(isAdmin){ location.href = '/admin'; } else { render(); }
</script>
</body>
</html>
